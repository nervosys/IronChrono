
[package]
name = "chrono-fuzz"
version = "0.0.0"
authors = ["David Korczynski <david@adalogics.com>"]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.chrono]
package = "ironchrono"
path = ".."
features = ["agent", "serde", "unstable-locales"]

[dependencies.serde_json]
version = "1"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_reader"
path = "fuzz_targets/fuzz_reader.rs"

[[bin]]
name = "fuzz_format"
path = "fuzz_targets/fuzz_format.rs"

[[bin]]
name = "fuzz_agent"
path = "fuzz_targets/fuzz_agent.rs"

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
